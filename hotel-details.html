<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hotel Details - GoExplore</title>

    <link
        rel="stylesheet"
        href="css/details.css"
    >

</head>


<body>

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            GoExplore
        </a>

        <a
            href="javascript:history.back()"
            class="back"
        >
            ← Back
        </a>

    </header>


    <main class="details-container">

        <section class="place-content">

            <span
                class="card-label hotel-label"
            >
                Hotel
            </span>


            <h1 id="hotelName">
                Loading...
            </h1>


            <p id="hotelAddress">
                Loading...
            </p>


            <div class="info-grid">

                <div class="info-card">

                    <h3>
                        Rating
                    </h3>

                    <p id="hotelStars">
                        —
                    </p>

                </div>


                <div class="info-card">

                    <h3>
                        City
                    </h3>

                    <p id="hotelCity">
                        —
                    </p>

                </div>

            </div>


            <div class="hotel-actions">

                <a
                    id="websiteButton"
                    class="map-btn hidden"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Visit Official Website
                </a>


                <a
                    id="hotelMapButton"
                    class="map-btn"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View on Map
                </a>

            </div>


            <p
                id="websiteUnavailable"
                class="empty hidden"
            >
                An official website was not
                available for this hotel.
            </p>

        </section>

    </main>


    <script src="hotel-details.js"></script>

</body>

</html>
